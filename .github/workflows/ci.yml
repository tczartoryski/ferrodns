name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +stable test
      - name: Check visualizer logic (mock DOM, not rendered browser proof)
        run: node scripts/check-viz.cjs site/viz/index.html
      - name: Check live frontend syntax and security/lifecycle logic
        run: |
          node --check site/viz/live.js
          node --check scripts/check-live-browser.cjs
          node scripts/check-live.cjs
