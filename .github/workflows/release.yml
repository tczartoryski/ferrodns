name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo +stable build --release --target ${{ matrix.target }}
      - run: tar -czf ferrodns-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ferrodns ferrodns-live
      - name: Attach binary to approved release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ferrodns-${{ matrix.target }}.tar.gz --clobber
